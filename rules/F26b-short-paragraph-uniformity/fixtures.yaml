schema: 1
rule: F26b
fixtures:
  - id: F26b-fail-001
    text: |-
      今天去海邊看企鵝了。

      牠們排成一列走路。

      回家時天已經黑了。
    expect: fail
    spans: [[0, 32]]
  - id: F26b-fail-002
    text: |-
      我把測試重新跑了一次，三個案例停在同一個位置。

      我換掉輸入資料再跑一次，三個案例仍停在原處。

      我清掉快取後又重跑一次，結果還是完全一樣。
    expect: fail
    spans: [[0, 70]]
  - id: F26b-pass-001
    text: |-
      昨天的部署在午夜失敗，原因是設定檔少了一個必要欄位。監控先回報逾時，實際錯誤藏在前一段日誌裡。

      我修好後又跑了一次。

      接著我把測試範圍擴到舊版本，才發現另一個解析差異：舊版接受空白值，新版會直接拒絕。我補了相容處理，也新增六個回歸案例。
    expect: pass
  - id: F26b-pass-002
    text: |-
      這份規格先定義輸入欄位，讓實作者能快速核對介面。

      錯誤回應只保留代碼。

      範例則涵蓋正常輸入、缺少欄位、型別錯誤和超出限制四種情況。每個範例都附上完整請求與回應，並說明呼叫端應該採取的下一步。
    expect: pass
  - id: F26b-pass-003
    text: |-
      成功了。

      好。

      我把整個流程從頭到尾重新檢查了一遍，包含設定、資料和輸出格式，確認每一步都和預期相同。
    expect: pass
