rule: F07a
fixtures:
  - id: F07a-fail-001
    text: 雖然天空下著雨，但我們仍照原定時間出發。儘管山路有些泥濘，不過大家走得很穩。固然午餐準備得簡單，然而熱湯很受歡迎。當然回程遇上塞車，但沒有人因此抱怨。
    expect: fail
    spans: [[0, 9]]
  - id: F07a-fail-002
    text: 誠然初稿還有缺口，但主要論證已經成立。雖然樣本數不算多，卻足以看出變化方向。儘管訪談時間有限，然而受訪者提供了具體例子。固然後續仍須驗證，不過這份結果值得先記錄。
    expect: fail
    spans: [[0, 10]]
  - id: F07a-pass-001
    text: 誠然這組樣本無法代表所有讀者，但它呈現了清楚的初步趨勢。固然訪談資料帶有回憶偏誤，然而不同受訪者的描述彼此吻合。當然研究仍需擴大規模，不過目前三組材料已足以支持後續設計。
    expect: pass
    note: 學術段落恰好三次，未超過門檻
  - id: F07a-pass-002
    text: 雖然第一版漏了兩個欄位，但修正後已能正常匯入。儘管舊資料格式不同，不過轉換腳本已涵蓋那些差異。其餘流程沿用原本設定，測試結果也保持一致。
    expect: pass
    note: 只使用兩次讓步框架
  - id: F07a-pass-003
    text: 受訪者說：「雖然時間很短，但我學到很多；儘管內容很難，不過老師解釋得很清楚；固然作業不少，然而每題都有用；當然還能改進，但我願意再來。」編輯只保留了這段原話。
    expect: pass
    note: 引述內容受保護
  - id: F07a-pass-004
    text: 這些理所當然的規定，卻常被忽略。大家想當然耳的步驟，卻最容易漏掉。店員說當然沒問題，不過要先預約。老闆說當然可以，但要付訂金。
    expect: pass
    note: 四個「當然」都不是讓步
  - id: F07a-pass-005
    text: |-
      我們家搬到花蓮已經三年。當初決定離開台北，是因為老大氣喘，醫師建議換個空氣好一點的地方。

      雖然工作機會少了很多，但孩子每天放學都能去海邊。老大的氣喘在第二個冬天就沒再發作過，這是我們最在意的事。

      我原本在台北做平面設計，搬來以後改接遠端案子。前半年收入掉了快一半，只好把存款拿出來撐。

      儘管房租便宜一半，不過來回車資加上住宿，其實省不了多少錢。第二年公司終於同意全面遠端，才真的鬆了一口氣。

      花蓮的生活步調很慢。早上七點多，市場的阿姨就已經在收攤；晚上九點以後，街上幾乎看不到人。

      鄰居阿姨常送菜過來，有時候是過貓，有時候是山蘇。雖然我們一開始不太會煮野菜，卻也慢慢學會了幾道。

      今年夏天颱風特別多，七月底那一個，整個村子停電兩天。

      儘管停電了整整兩天，但大家互相照應，沒有人出事。颱風過後第三天，路就通了。
    expect: pass
    note: 人寫的長文，四次讓步分散在各段
  - id: F07a-pass-006
    text: 「雖然價格上漲，但需求仍強。」「雖然下雨，但還是出門。」「雖然工期延後，但品質不變。」雖然市場冷清，但訂單還在。
    expect: pass
    note: 審查探針（09-27）：三句在引號內受保護，作者自己只寫一次，不到 4 次
