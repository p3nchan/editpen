  - id: D02a-pass-003
    text: |-
      我現在寫稿，第一版幾乎都丟給 AI。

      它出初稿很快，改起來也快。可是它寫出來的句子常常太工整，每段都像範本。我會先刪掉開場那句空話，再把三個並排的理由挑一個留下來講清楚。

      最後一段通常整段刪掉。讀者讀到這裡，已經知道我想說什麼了。
    expect: pass
    note: 「最後」是形容詞；全文也不到 3 個連接詞
