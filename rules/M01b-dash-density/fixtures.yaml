  - id: M01b-fail-002
    text: 台南從來不是一座需要「趕行程」的城市——它更像一本要慢慢翻的書。這次我花了三天，只想好好感受這座城市的溫度。第一天從赤崁樓出發，沿著民族路一路吃過去。早餐一定要留胃給牛肉湯——現切溫體牛肉，淋上滾燙的大骨湯，清甜到讓人想再來一碗。中午轉進神農街，老屋、燈籠、小小的手作店，每一步都像走進舊時光。下午的甜點時間不能錯過——冬瓜茶、豆花、芋圓，每一口都是古早味的溫柔。第二天去了安平。老街的蝦餅和劍獅是必看，但真正讓我停下腳步的，是傍晚的安平港——夕陽把整片海染成金色，時間彷彿慢了下來。第三天留給孔廟和附近的巷弄。孔廟前的大樹下坐著聊天的長輩，巷口賣麻糬的阿嬤，都讓人感受到台南人的從容。如果你也正在規劃台南小旅行，我的建議很簡單：不要排太滿，留一點空白給偶然。台南最迷人的地方，從來不在清單上——而在那些你沒預期的轉角。最後整理幾個實用小提醒：一、牛肉湯店多半只做早午市，想吃要早起；二、週末神農街人潮多，平日去更能好好拍照；三、安平到市區的公車班次不算密，建議租一台腳踏車或機車，移動會自在很多；四、夏天午後常有雷陣雨，記得隨身帶傘。這三天走下來，我最大的感想是：旅行不一定要去很遠的地方，只要願意放慢，熟悉的城市也能給你新的驚喜。希望這篇分享能幫你安排一趟屬於自己的台南慢旅行，也歡迎在留言分享你最愛的台南小吃，讓我下次去的時候照著清單一家一家吃過去。
    expect: fail
    spans: [[18, 20]]
    note: Claude 風格的社群貼文：約 800 字裡 5 個破折號
