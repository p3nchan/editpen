  - id: M01b-pass-003
    text: 週末到台南走了一趟，從火車站出來就先去吃牛肉湯，湯頭清甜，肉片薄到透光。接著沿著中西區的小巷慢慢逛，看老屋改成的書店和雜貨店，店主多半很健談，會推薦附近值得一去的小吃。下午在孔廟前的樹下坐了很久，聽旁邊的阿伯聊以前這一帶的樣子，說早年這裡都是木造平房，巷口有一間專賣麻糬的小攤。傍晚去安平看夕陽，人不算多，海風很舒服。晚餐吃了虱目魚粥和蝦捲，最後買了兩盒鳳梨酥帶回台北給同事。這趟行程最大的收穫是放慢腳步——不用趕景點，走到哪裡算哪裡。上個月到台南走了一趟，從火車站出來就先去吃牛肉湯，湯頭清甜，肉片薄到透光。接著沿著中西區的小巷慢慢逛，看老屋改成的書店和雜貨店，店主多半很健談，會推薦附近值得一去的小吃。下午在孔廟前的樹下坐了很久，聽旁邊的阿伯聊以前這一帶的樣子，說早年這裡都是木造平房，巷口有一間專賣麻糬的小攤。傍晚去安平看夕陽，人不算多，海風很舒服。晚餐吃了虱目魚粥和蝦捲，最後買了兩盒鳳梨酥帶回台北給同事。下次想挑平日再來，避開人潮──順便去看看還沒逛到的鹽水老街。
    expect: pass
    note: 長文裡兩個破折號，未達 3 個
