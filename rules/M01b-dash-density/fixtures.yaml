    text: 這支新耳機的降噪表現讓我很意外——在捷運上幾乎聽不到車廂噪音。續航也很夠用——一整天通勤加上午休聽音樂，晚上還剩一半電量。唯一的小缺點是觸控區太敏感——戴帽子時常常誤觸。整體來說，以這個價位來看——我會推薦給每天通勤的上班族。
    expect: fail
    spans: [[15, 17]]
