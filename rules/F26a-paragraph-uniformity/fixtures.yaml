schema: 1
rule: F26a
fixtures:
  - id: F26a-fail-001
    text: |-
      我把昨天的測試重新跑了一次，三個失敗案例都停在相同位置，紀錄也完全一致。

      我接著換掉輸入資料再跑一次，三個失敗案例仍停在原處，紀錄沒有明顯差異。

      我最後清掉快取又重跑一次，三個失敗案例還是停在原處，紀錄依然沒有變化。
    expect: fail
    spans: [[0, 110]]
  - id: F26a-fail-002
    text: |-
      團隊週一先核對需求和限制，並把仍有疑問的地方逐項標出，交給負責人確認。

      團隊週二再整理樣本和格式，並把缺少來源的資料逐項標出，交給編輯確認。

      團隊週三才執行檢查和測試，並把輸出不同的案例逐項標出，交給作者確認。
    expect: fail
    spans: [[0, 107]]
  - id: F26a-fail-003
    text: |-
      第一輪只處理讀檔錯誤，確認每種文字編碼都能正常載入，也保留原本的換行位置。

      第二輪只處理規則錯誤，確認每個測試案例都能正常比對，也列出實際命中的位置。

      第三輪只處理輸出錯誤，確認每種報告格式都能正常顯示，也維持固定排序方式。
    expect: fail
    spans: [[0, 114]]
  - id: F26a-pass-001
    text: |-
      昨天的部署在午夜失敗，原因是設定檔少了一個必要欄位。監控先回報逾時，實際錯誤藏在前一段日誌裡。

      我修好後又跑了一次。成功了。

      接著我把測試範圍擴到舊版本，才發現另一個解析差異：舊版接受空白值，新版會直接拒絕。我補了相容處理，也新增六個回歸案例，讓這個差異不會在下次更新時悄悄回來。整輪測試跑了四十二秒，輸出和預期相同。
    expect: pass
  - id: F26a-pass-002
    text: |-
      這份規格先定義輸入欄位、必要型別和拒絕條件，讓實作者能快速核對介面。

      錯誤回應只保留代碼。

      範例則涵蓋正常輸入、缺少欄位、型別錯誤和超出限制四種情況。每個範例都附上完整請求與回應，並說明呼叫端應該採取的下一步，避免使用者只看到錯誤卻不知道如何恢復。最後一節列出相容版本和已知限制，方便維護者在升級前完成檢查。
    expect: pass
